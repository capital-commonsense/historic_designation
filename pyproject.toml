[project]
name = "historic-preservation"
version = "0.1.0"
description = "Reproducible pipeline for DC historic-preservation data, hypotheses and charts"
readme = "README.md"
authors = [
    { name = "Tom Lee", email = "thomas.j.lee@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
historic-preservation = "historic_preservation.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
